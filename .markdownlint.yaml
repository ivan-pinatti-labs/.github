# Checked by the markdownlint-cli2 pre-commit hook.
#
# This is markdownlint's rule configuration, not markdownlint-cli2's runner
# configuration, so runner options do not belong here. Findings are reported
# and fixed by hand; add a .markdownlint-cli2.yaml if auto-fixing is ever
# wanted (see CI never autofixes in rsync-crypt's AGENTS.md for why this repo
# does not do that by default).

# MD013: line-length, set to 100. Turned off inside code blocks and tables:
# docs/crypto/addresses.md is one wide pipe table by design (an <img> tag and
# an address per cell), and wrapping those rows would not make them more
# readable.
MD013:
  line_length: 100
  code_blocks: false
  tables: false

# The README's support block (sponsor badges and the crypto QR table) is
# HTML, as in every repository of the organization; allow exactly the
# elements it uses.
MD033:
  allowed_elements: [a, br, code, div, img, table, td, tr]
