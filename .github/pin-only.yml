---
# What a dependency bot may change here without a person reading the diff.
# Read by the shared `Pin Only` check in ivan-pinatti-labs/gh-actions, which
# reads it from the default branch rather than from the pull request being
# graded. This file is deliberately absent from its own allowed_paths, so a
# bot cannot widen its own lane.
#
# New here, unlike in every other repository in this organization, which each
# carried their own copy of the check this configures. This was the one with
# no `Pin Only` context at all, which is why a routine Renovate bump here had
# to wait for a real CodeRabbit review and spend a slot from the shared OSS
# quota to get one.
#
# All three surfaces Renovate watches in .github/renovate.json5, the
# L2 image digest (.devcontainer/l2/Dockerfile) included.
#
# That digest was held out when this lane was first added, because
# .github/renovate.json5 sets `minimumReleaseAgeBehaviour: timestamp-optional`
# for it, waiving the seven day cooling window on the stated grounds that "the
# review stands in for the age window". Granting the lane removes that review,
# so on its own it would have left the bump with neither an age gate nor a
# reader.
#
# The compensating control is upstream instead, which is the same answer the
# other five consumers of that image already rely on:
# ivan-pinatti-labs/devcontainer-airlock ages its own upstream inputs through a
# seven day minimumReleaseAge, sends Ubuntu minor and major moves to a person,
# and publishes only from a reviewed merge to main. A digest reaching this
# repository has therefore already been read by someone and already waited out
# a window; it is untimestamped, not unvetted. Nothing about this repository
# makes the same image riskier here than it is in rsync-crypt.
#
# So the review this waiver leaned on is not being dropped, it is being
# located where it actually happens. See the packageRules entry for
# .devcontainer/l2/Dockerfile in .github/renovate.json5, which now says the same.
allowed_paths:
  - .pre-commit-config.yaml
  - .github/workflows/
  - .devcontainer/l2/Dockerfile

rules:
  - path: .devcontainer/l2/Dockerfile
    grammars: [image_digest]
  - path: .github/workflows/
    grammars:
      - name: action_sha
        when: outside_block_scalar
      - name: bare_action_version
        when: outside_block_scalar
      - name: rev_pin
        when: outside_block_scalar

default_grammars: [action_sha, bare_action_version, rev_pin]
