name: PR Validation

# Adapted from rsync-crypt's pull-request-validation.yml, trimmed to the one
# job this repo needs: there is no app code, so no Tests or Docker Build job.
# No merge_group trigger either: this repository has no merge queue ruleset,
# just branch protection with two required status checks, so there is no
# queue's temporary commit for this workflow to run against.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Explicit steps rather than pre-commit/action, which installs whatever
      # pre-commit PyPI has newest and calls actions/cache by tag. The version
      # is the one Ubuntu ships in the development container, so CI and a
      # local run agree; Python is the organization's 3.14.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      # Wheels only, so no package's build script runs at install time.
      - name: Install pre-commit
        run: pip install --only-binary=:all: "pre-commit==4.5.1"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always
