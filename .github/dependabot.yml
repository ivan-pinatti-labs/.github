version: 2

# Dependabot handles GitHub Actions and pre-commit hooks, same split as
# rsync-crypt's dependabot.yml. There is no Renovate here: no .tool-versions
# pin beyond pre-commit itself, and no .env.example to track.
#
# Scheduled Tuesday rather than rsync-crypt's Monday: see
# docs/BOT_SCHEDULE.md, which reserves Tuesday as a spare day for exactly
# this kind of low-traffic addition, specifically to avoid competing with
# rsync-crypt's Monday 06:00-07:00 window for CodeRabbit's shared review
# quota.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: America/Toronto
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Toronto
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
