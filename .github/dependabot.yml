version: 2

# Dependabot handles GitHub Actions and pre-commit hooks, same split as
# rsync-crypt's dependabot.yml. There is no Renovate here: no .tool-versions
# pin beyond pre-commit itself, and no .env.example to track.
#
# Daily, like Renovate and like every other repository here. This used to be
# Tuesday, one weekday out of a per-repository table, to keep repositories
# from competing for CodeRabbit's shared review quota. A pin-only Dependabot
# bump resolves `Review Verified` through the bot lane and asks CodeRabbit for
# nothing, so that table was rationing a resource Dependabot never consumed,
# while a weekly slot added up to seven days on top of the seven day cooling
# window below. See README.md, "Dependency policy".
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/Toronto
    # Seven days, matching Renovate's minimumReleaseAge. See README.md,
    # "Both bots wait seven days", for why both bots carry the same floor and
    # why only default-days is set here.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/Toronto
    # Seven days, matching Renovate's minimumReleaseAge. See README.md,
    # "Both bots wait seven days", for why both bots carry the same floor and
    # why only default-days is set here.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
