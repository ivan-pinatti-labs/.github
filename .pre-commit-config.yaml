---
# Adapted from rsync-crypt's .pre-commit-config.yaml, trimmed for a repo that
# is just a README, docs/BOT_SCHEDULE.md, and PNG QR codes: no Dockerfile, no
# app code, no tests, no .env, no Makefile. rsync-crypt's hooks come from
# ivan-pinatti/pre-commit-checklists, a Docker-based runner built for exactly
# that kind of repo; there is nothing here for most of its checklists to
# check, so this repo uses the plain upstream hooks directly instead of
# carrying that runner's overhead.
#
# default_install_hook_types covers both stages up front so `pre-commit
# install --hook-type pre-commit --hook-type commit-msg` (per the migration
# notes) and a plain `pre-commit install` behave the same way.
#
# There is deliberately no `ci:` block, same reasoning as rsync-crypt: that
# block configures pre-commit.ci, whose autofix_prs would commit and push
# fixes back to a pull request branch. CI here is a gate, not an autofixer: a
# hook that finds something fixable fails the run and the author fixes it by
# hand.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        # The QR-code PNGs here run roughly 1-2 KB each. 2048 KB leaves
        # headroom for a future higher-resolution asset without raising the
        # limit so high it stops catching an accidental large file.
        args: [--maxkb=2048]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        files: \.md$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # Closes the gap rsync-crypt's checklist-git-commit-msg leaves here:
  # Dependabot already opens its pull requests with `ci:`/`chore:` prefixes,
  # but nothing enforced Conventional Commits on anything a human types
  # locally until this hook was added.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
