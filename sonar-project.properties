# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_.github
sonar.projectName=.github

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (the workflows, YAML and the L2
# Dockerfile here) plus its secrets detection, which runs over every text
# file. There is no application code and no test suite, so no sonar.tests
# and no coverage report.
#
# Excluded:
#   .secrets.baseline  generated by detect-secrets, only records hashes.
#   docs/crypto/**     the donation addresses and their QR codes. Public by
#                      design, and changed only on a maintainer's explicit
#                      request, so a finding there is noise nobody may act
#                      on.
#   **/*.png           binary images, nothing for any analyzer to read.
sonar.sources=.
sonar.exclusions=.secrets.baseline,docs/crypto/**,**/*.png

sonar.sourceEncoding=UTF-8
